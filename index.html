<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petualangan Belajar</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #f0fdf4; }
        .title-font { font-family: 'Fredoka One', cursive; }
        .btn-game { transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94); box-shadow: 0 6px 0 rgba(0,0,0,0.15); }
        .btn-game:active { transform: translateY(6px); box-shadow: 0 0 0 rgba(0,0,0,0.15); }
        .animate-pop { animation: pop 0.3s ease-out; }
        @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-6px, 0, 0); } 40%, 60% { transform: translate3d(6px, 0, 0); } }
        .bounce { animation: bounce 0.5s; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        
        #timer-bar { transition: width 1s linear; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div id="app" class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden border-8 border-white">
        <div class="bg-sky-400 p-6 text-center text-white border-b-8 border-sky-500">
            <h2 class="title-font text-3xl drop-shadow">⭐ Belajar Seru ⭐</h2>
        </div>
        
        <div class="p-6 md:p-8 bg-slate-50 min-h-[400px] flex flex-col justify-center relative">
            
            <!-- MENU UTAMA -->
            <div id="view-menu" class="animate-pop text-center">
                <h3 class="text-xl font-bold text-slate-700 mb-6">Pilih Permainanmu!</h3>
                <div class="space-y-4">
                    <button onclick="pilihLevel('math')" class="btn-game w-full bg-emerald-400 hover:bg-emerald-500 text-white font-bold py-4 px-6 rounded-2xl text-lg flex items-center justify-center gap-3">
                        🧮 Kuis Matematika
                    </button>
                    <button onclick="pilihLevel('gk')" class="btn-game w-full bg-amber-400 hover:bg-amber-500 text-white font-bold py-4 px-6 rounded-2xl text-lg flex items-center justify-center gap-3">
                        🌍 Pengetahuan Umum
                    </button>
                </div>
            </div>

            <!-- PILIH LEVEL -->
            <div id="view-level" class="animate-pop text-center hidden">
                <h3 class="text-xl font-bold text-slate-700 mb-6">Pilih Tingkat Kesulitan</h3>
                <div class="space-y-4">
                    <button onclick="mulaiGame('easy')" class="btn-game w-full bg-green-400 hover:bg-green-500 text-white font-bold py-3 px-6 rounded-2xl text-lg">
                        🌱 Mudah
                    </button>
                    <button onclick="mulaiGame('medium')" class="btn-game w-full bg-yellow-400 hover:bg-yellow-500 text-white font-bold py-3 px-6 rounded-2xl text-lg">
                        🔥 Sedang
                    </button>
                    <button onclick="mulaiGame('hard')" class="btn-game w-full bg-red-400 hover:bg-red-500 text-white font-bold py-3 px-6 rounded-2xl text-lg">
                        ⚡ Sulit
                    </button>
                </div>
                <button onclick="tampilMenu()" class="mt-6 text-slate-500 font-bold hover:text-slate-700">🔙 Kembali</button>
            </div>

            <!-- AREA GAME -->
            <div id="view-game" class="hidden">
                <div class="flex justify-between items-center mb-4">
                    <div class="bg-indigo-100 text-indigo-700 px-4 py-2 rounded-xl font-bold">
                        Soal: <span id="question-count">1</span>/10
                    </div>
                    <div class="bg-amber-100 text-amber-700 px-4 py-2 rounded-xl font-bold">
                        Skor: <span id="score-display">0</span>
                    </div>
                </div>

                <!-- TIMER -->
                <div class="w-full bg-gray-200 rounded-full h-4 mb-6 overflow-hidden">
                    <div id="timer-bar" class="bg-red-400 h-4 rounded-full w-full"></div>
                </div>

                <div class="bg-white p-6 rounded-2xl shadow-sm border-2 border-slate-100 text-center mb-6">
                    <h3 id="question-text" class="text-2xl font-bold text-slate-800 title-font mb-2">Siap?</h3>
                </div>

                <div id="options-container" class="grid grid-cols-2 gap-4">
                    <!-- Opsi jawaban akan diisi oleh JS -->
                </div>
            </div>

            <!-- HASIL AKHIR -->
            <div id="view-result" class="hidden text-center animate-pop">
                <div class="text-6xl mb-4" id="result-emoji">🏆</div>
                <h3 class="text-2xl font-bold text-slate-800 title-font mb-2" id="result-title">Hebat!</h3>
                <p class="text-slate-600 mb-6 text-lg">Kamu mendapatkan skor <span id="final-score" class="font-bold text-sky-500 text-2xl">0</span></p>
                <button onclick="tampilMenu()" class="btn-game w-full bg-sky-400 hover:bg-sky-500 text-white font-bold py-4 px-6 rounded-2xl text-lg">
                    🏠 Main Lagi
                </button>
            </div>

        </div>
    </div>

    <script>
        // State Permainan
        let state = {
            mode: '', // 'math' atau 'gk'
            level: '', // 'easy', 'medium', 'hard'
            score: 0,
            questionCount: 0,
            maxQuestions: 10,
            currentAnswer: null,
            timer: null,
            timeLeft: 10
        };

        // Bank Soal Pengetahuan Umum (GK)
        const gkQuestions = {
            easy: [
                { q: "Apa warna daun yang sehat?", o: ["Hijau", "Biru", "Merah", "Hitam"], a: "Hijau" },
                { q: "Hewan apa yang menghasilkan susu?", o: ["Sapi", "Ayam", "Burung", "Ular"], a: "Sapi" },
                { q: "Berapa jumlah jari tangan manusia normal?", o: ["10", "8", "5", "12"], a: "10" },
                { q: "Matahari terbit di sebelah mana?", o: ["Timur", "Barat", "Utara", "Selatan"], a: "Timur" },
                { q: "Apa nama planet yang kita tinggali?", o: ["Bumi", "Mars", "Jupiter", "Venus"], a: "Bumi" },
                { q: "Hewan apa yang mengeong?", o: ["Kucing", "Anjing", "Tikus", "Kambing"], a: "Kucing" },
                { q: "Buah apa yang warnanya kuning dan disukai monyet?", o: ["Pisang", "Apel", "Jeruk", "Anggur"], a: "Pisang" },
                { q: "Hewan apa yang memiliki belalai panjang?", o: ["Gajah", "Jerapah", "Kuda", "Harimau"], a: "Gajah" },
                { q: "Mata digunakan untuk?", o: ["Melihat", "Mendengar", "Mencium", "Meraba"], a: "Melihat" },
                { q: "Ikan bernapas menggunakan apa?", o: ["Insang", "Paru-paru", "Kulit", "Hidung"], a: "Insang" },
                { q: "Kendaraan yang berjalan di atas rel adalah?", o: ["Kereta Api", "Mobil", "Pesawat", "Kapal"], a: "Kereta Api" },
                { q: "Apa rasa dari air laut?", o: ["Asin", "Manis", "Pahit", "Asam"], a: "Asin" },
                { q: "Hewan apa yang suka makan wortel?", o: ["Kelinci", "Kucing", "Singa", "Burung"], a: "Kelinci" },
                { q: "Berapa jumlah kaki laba-laba?", o: ["8", "6", "4", "10"], a: "8" },
                { q: "Matahari terbenam di sebelah mana?", o: ["Barat", "Timur", "Utara", "Selatan"], a: "Barat" }
            ],
            medium: [
                { q: "Apa ibukota Indonesia?", o: ["Jakarta", "Surabaya", "Bandung", "Bali"], a: "Jakarta" },
                { q: "Siapa penemu lampu pijar?", o: ["Thomas Edison", "Albert Einstein", "Isaac Newton", "Nikola Tesla"], a: "Thomas Edison" },
                { q: "Berapa hari dalam setahun kabisat?", o: ["366", "365", "364", "360"], a: "366" },
                { q: "Apa nama gunung tertinggi di dunia?", o: ["Everest", "Rinjani", "Fuji", "Himalaya"], a: "Everest" },
                { q: "Provinsi paling timur di Indonesia adalah?", o: ["Papua", "Maluku", "NTT", "Sulawesi"], a: "Papua" },
                { q: "Pusat dari tata surya kita adalah?", o: ["Matahari", "Bumi", "Bulan", "Bintang"], a: "Matahari" },
                { q: "Candi Buddha terbesar di Indonesia adalah?", o: ["Borobudur", "Prambanan", "Mendut", "Sewu"], a: "Borobudur" },
                { q: "Apa mata uang negara Jepang?", o: ["Yen", "Won", "Yuan", "Ringgit"], a: "Yen" },
                { q: "Siapakah penemu telepon?", o: ["Alexander Graham Bell", "Thomas Edison", "Galileo", "Newton"], a: "Alexander Graham Bell" },
                { q: "Katak termasuk jenis hewan apa?", o: ["Amfibi", "Reptil", "Mamalia", "Burung"], a: "Amfibi" },
                { q: "Tari Pendet berasal dari daerah mana?", o: ["Bali", "Jawa Barat", "Sumatera", "Sulawesi"], a: "Bali" },
                { q: "Apa lambang sila ke-3 Pancasila?", o: ["Pohon Beringin", "Bintang", "Rantai", "Padi dan Kapas"], a: "Pohon Beringin" },
                { q: "Planet mana yang dijuluki 'Planet Merah'?", o: ["Mars", "Venus", "Jupiter", "Saturnus"], a: "Mars" },
                { q: "Seni melipat kertas dari Jepang disebut?", o: ["Origami", "Ikebana", "Judo", "Haiku"], a: "Origami" }
            ],
            hard: [
                { q: "Gas apa yang paling banyak di atmosfer Bumi?", o: ["Nitrogen", "Oksigen", "Karbon Dioksida", "Hidrogen"], a: "Nitrogen" },
                { q: "Tahun berapa Indonesia merdeka?", o: ["1945", "1940", "1950", "1955"], a: "1945" },
                { q: "Siapa Presiden ke-3 Indonesia?", o: ["B.J. Habibie", "Soeharto", "Megawati", "Gus Dur"], a: "B.J. Habibie" },
                { q: "Apa nama benua terkecil di dunia?", o: ["Australia", "Eropa", "Antartika", "Afrika"], a: "Australia" },
                { q: "Senyawa kimia dari air adalah?", o: ["H2O", "CO2", "O2", "NaCl"], a: "H2O" },
                { q: "Benua terluas di dunia adalah?", o: ["Asia", "Amerika", "Afrika", "Eropa"], a: "Asia" },
                { q: "Siapa penulis novel Laskar Pelangi?", o: ["Andrea Hirata", "Raditya Dika", "Pramoedya", "Tere Liye"], a: "Andrea Hirata" },
                { q: "Pada tahun berapa peristiwa Sumpah Pemuda terjadi?", o: ["1928", "1945", "1908", "1965"], a: "1928" },
                { q: "Zat hijau daun pada tumbuhan disebut?", o: ["Klorofil", "Kromosom", "Kloroplas", "Stomata"], a: "Klorofil" },
                { q: "Apa satuan ukur untuk tegangan listrik?", o: ["Volt", "Watt", "Ampere", "Ohm"], a: "Volt" },
                { q: "Samudra terluas di dunia adalah?", o: ["Pasifik", "Atlantik", "Hindia", "Arktik"], a: "Pasifik" },
                { q: "Logam apa yang berbentuk cair pada suhu ruang?", o: ["Raksa", "Besi", "Emas", "Perak"], a: "Raksa" },
                { q: "Hormon apa yang mengatur kadar gula dalam darah?", o: ["Insulin", "Adrenalin", "Testosteron", "Estrogen"], a: "Insulin" },
                { q: "Kerajaan Islam pertama di Indonesia adalah?", o: ["Samudera Pasai", "Demak", "Mataram", "Banten"], a: "Samudera Pasai" }
            ]
        };

        // Fungsi Audio Sederhana
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // Navigasi Tampilan
        function hideAllViews() {
            document.getElementById('view-menu').classList.add('hidden');
            document.getElementById('view-level').classList.add('hidden');
            document.getElementById('view-game').classList.add('hidden');
            document.getElementById('view-result').classList.add('hidden');
        }

        function tampilMenu() {
            clearInterval(state.timer);
            hideAllViews();
            document.getElementById('view-menu').classList.remove('hidden');
        }

        function pilihLevel(mode) {
            state.mode = mode;
            hideAllViews();
            document.getElementById('view-level').classList.remove('hidden');
        }

        function mulaiGame(level) {
            state.level = level;
            state.score = 0;
            state.questionCount = 0;
            document.getElementById('score-display').innerText = state.score;
            hideAllViews();
            document.getElementById('view-game').classList.remove('hidden');
            lanjutSoal();
        }

        // Logika Game
        function generateMathQuestion() {
            let num1, num2, operator;
            const ops = ['+', '-'];
            const opsMedium = ['+', '-', '*'];
            const opsHard = ['+', '-', '*', '/'];

            if (state.level === 'easy') {
                num1 = Math.floor(Math.random() * 10) + 1;
                num2 = Math.floor(Math.random() * 10) + 1;
                operator = ops[Math.floor(Math.random() * ops.length)];
            } else if (state.level === 'medium') {
                num1 = Math.floor(Math.random() * 20) + 1;
                num2 = Math.floor(Math.random() * 15) + 1;
                operator = opsMedium[Math.floor(Math.random() * opsMedium.length)];
            } else {
                num1 = Math.floor(Math.random() * 50) + 1;
                num2 = Math.floor(Math.random() * 20) + 1;
                operator = opsHard[Math.floor(Math.random() * opsHard.length)];
            }

            // Pastikan hasil pengurangan tidak negatif (untuk anak-anak) dan pembagian bulat
            if (operator === '-' && num1 < num2) [num1, num2] = [num2, num1];
            if (operator === '*') { num1 = num1 % 12; num2 = num2 % 12; } // Batasi perkalian agar tidak terlalu besar
            if (operator === '/') { num1 = num1 * num2; } // Pastikan pembagian habis

            let answer;
            switch(operator) {
                case '+': answer = num1 + num2; break;
                case '-': answer = num1 - num2; break;
                case '*': answer = num1 * num2; break;
                case '/': answer = num1 / num2; break;
            }

            let options = [answer];
            while(options.length < 4) {
                let wrong = answer + (Math.floor(Math.random() * 10) - 5);
                if(wrong !== answer && !options.includes(wrong) && wrong >= 0) options.push(wrong);
            }
            options.sort(() => Math.random() - 0.5);

            return {
                q: `${num1} ${operator.replace('*', 'x').replace('/', ':')} ${num2} = ?`,
                o: options.map(String),
                a: String(answer)
            };
        }

        function lanjutSoal() {
            state.questionCount++;
            if (state.questionCount > state.maxQuestions) {
                selesaiGame();
                return;
            }

            document.getElementById('question-count').innerText = state.questionCount;
            
            let qData;
            if (state.mode === 'math') {
                qData = generateMathQuestion();
            } else {
                let bank = gkQuestions[state.level];
                qData = bank[Math.floor(Math.random() * bank.length)];
            }

            state.currentAnswer = qData.a;
            document.getElementById('question-text').innerText = qData.q;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            let shuffledOptions = [...qData.o].sort(() => Math.random() - 0.5);

            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.innerText = opt;
                btn.className = "btn-game bg-sky-100 hover:bg-sky-200 text-sky-800 font-bold py-4 px-4 rounded-2xl text-lg border-2 border-sky-300";
                btn.onclick = () => cekJawaban(opt, btn);
                optionsContainer.appendChild(btn);
            });

            mulaiTimer();
        }

        function mulaiTimer() {
            clearInterval(state.timer);
            state.timeLeft = 10;
            const timerBar = document.getElementById('timer-bar');
            timerBar.style.width = '100%';
            timerBar.className = "h-4 rounded-full w-full bg-green-400"; // Reset warna ke hijau

            state.timer = setInterval(() => {
                state.timeLeft--;
                const percentage = (state.timeLeft / 10) * 100;
                timerBar.style.width = percentage + '%';

                if (state.timeLeft <= 5) timerBar.className = "h-4 rounded-full w-full bg-amber-400";
                if (state.timeLeft <= 2) timerBar.className = "h-4 rounded-full w-full bg-red-400";

                if (state.timeLeft <= 0) {
                    clearInterval(state.timer);
                    cekJawaban(null, null); // Waktu habis = salah
                }
            }, 1000);
        }

        function cekJawaban(jawabanPilih, btnElemen) {
            clearInterval(state.timer);
            const app = document.getElementById('app');

            if (jawabanPilih === state.currentAnswer) {
                playSound('correct');
                state.score += 10;
                document.getElementById('score-display').innerText = state.score;
                if(btnElemen) {
                    btnElemen.classList.remove('bg-sky-100', 'border-sky-300');
                    btnElemen.classList.add('bg-green-400', 'text-white', 'border-green-500');
                }
                app.classList.add('bounce');
            } else {
                playSound('wrong');
                if(btnElemen) {
                    btnElemen.classList.remove('bg-sky-100', 'border-sky-300');
                    btnElemen.classList.add('bg-red-400', 'text-white', 'border-red-500');
                }
                app.classList.add('shake');
            }

            setTimeout(() => {
                app.classList.remove('shake', 'bounce');
                lanjutSoal();
            }, 800);
        }

        function selesaiGame() {
            clearInterval(state.timer);
            hideAllViews();
            const viewResult = document.getElementById('view-result');
            viewResult.classList.remove('hidden');
            
            document.getElementById('final-score').innerText = state.score;
            const emoji = document.getElementById('result-emoji');
            const title = document.getElementById('result-title');
            
            if (state.score === 100) {
                emoji.innerText = "🏆";
                title.innerText = "Sempurna!";
            } else if (state.score >= 70) {
                emoji.innerText = "⭐";
                title.innerText = "Kerja Bagus!";
            } else {
                emoji.innerText = "💪";
                title.innerText = "Tetap Semangat!";
            }
        }
    </script>
</body>
</html>
